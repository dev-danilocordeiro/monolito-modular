spring.application.name=escola

spring.datasource.url=jdbc:postgresql://localhost:5432/escola
spring.datasource.username=escola
spring.datasource.password=escola

spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.republish-outstanding-events-on-restart=true

spring.kafka.bootstrap-servers=localhost:9092

# Passo 4: escola.turmas.modo=remoto (ou ESCOLA_TURMAS_MODO=remoto) troca o TurmasLocal pelo TurmasRemoto.
# Voltar para local é o rollback.
escola.turmas.url=${ESCOLA_TURMAS_URL:http://localhost:8081}
spring.http.clients.connect-timeout=1s
spring.http.clients.read-timeout=2s
