services:
  postgres:
    image: postgres:18-alpine
    # Passo 5: wal_level=logical para replicar o schema turmas para o banco do serviço
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: escola
      POSTGRES_USER: escola
      POSTGRES_PASSWORD: escola
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escola -d escola"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-turmas:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: turmas
      POSTGRES_USER: turmas
      POSTGRES_PASSWORD: turmas
    ports:
      - "${POSTGRES_TURMAS_PORTA:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turmas -d turmas"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNO://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNO://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNO:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  servico-turmas:
    build:
      context: .
      dockerfile: servico-turmas/Dockerfile
    ports:
      - "${SERVICO_TURMAS_PORTA:-8081}:8080"
    environment:
      SERVER_PORT: 8080
      # Passo 5: banco próprio. Antes do corte, TURMAS_DB_URL aponta para o banco do monolito.
      SPRING_DATASOURCE_URL: ${TURMAS_DB_URL:-jdbc:postgresql://postgres-turmas:5432/turmas}
      SPRING_DATASOURCE_USERNAME: ${TURMAS_DB_USUARIO:-turmas}
      SPRING_DATASOURCE_PASSWORD: ${TURMAS_DB_SENHA:-turmas}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      postgres-turmas:
        condition: service_healthy
      kafka:
        condition: service_started
