spring.application.name=servico-turmas
server.port=8081

# Passo 3: o serviço usa o MESMO schema turmas do banco do monolito.
spring.datasource.url=jdbc:postgresql://localhost:5432/escola
spring.datasource.username=escola
spring.datasource.password=escola

# O registro de publicações do serviço mora no schema turmas, não no public do monolito:
# assim um não reprocessa as publicações do outro, e a tabela sai junto com o schema.
spring.modulith.events.jdbc.schema=turmas
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.republish-outstanding-events-on-restart=true

spring.kafka.bootstrap-servers=localhost:9092
