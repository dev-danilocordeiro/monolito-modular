[project]
name = "escola"
version = "0.1.0"
description = "Fronteiras de módulos com import-linter (post 3 da série Monolito Modular na Prática)"
requires-python = ">=3.12"
dependencies = ["fastapi (>=0.120,<1.0)"]

[tool.poetry]
packages = [{ include = "escola" }]

[tool.poetry.group.dev.dependencies]
import-linter = "^2.15"
pytest = "^9.1"
httpx = ">=0.28"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
